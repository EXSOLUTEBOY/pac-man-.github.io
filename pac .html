<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man - One Chaser</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #050505;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        color: #ffd900;
        margin: 15px 0 8px;
        font-size: 36px;
        letter-spacing: 2px;
    }

    #info {
        display: flex;
        justify-content: center;
        gap: 50px;
        font-size: 20px;
        margin-bottom: 10px;
    }

    #score {
        color: #00ff88;
    }

    #lives {
        color: #ff4444;
    }

    canvas {
        display: block;
        margin: auto;
        background: black;
        border: 3px solid #222;
        max-width: 95vw;
        height: auto;
    }

    #message {
        margin: 10px;
        font-size: 18px;
        min-height: 25px;
    }

    button {
        background: #ffd900;
        color: black;
        border: none;
        padding: 11px 25px;
        border-radius: 8px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        transform: scale(1.05);
    }

    .controls {
        margin-top: 12px;
        color: #aaa;
        font-size: 14px;
    }
</style>
</head>

<body>

<h1>🟡 PAC-MAN</h1>

<div id="info">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
</div>

<canvas id="game"></canvas>

<div id="message">Use the arrow keys to move!</div>

<button onclick="restartGame()">Restart Game</button>

<div class="controls">
    Arrow Keys = Move
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const livesElement = document.getElementById("lives");
const messageElement = document.getElementById("message");

const TILE = 24;

/*
    # = Wall
    . = Normal pellet
    o = Power pellet
    P = Pac-Man
    G = One ghost
    - = Empty space
*/

const LEVEL = [
"############################",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#o####.#####.##.#####.####o#",
"#..........................#",
"#.####.##.########.##.####.#",
"#......##....##....##......#",
"######.#####.##.#####.######",
"######.#####.##.#####.######",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#...##................##...#",
"###.##.####....####.##.###",
"###.##.#          #.##.###",
"#......#    GG    #......#",
"###.##.#          #.##.###",
"###.##.####....####.##.###",
"#...##................##...#",
"#.####.#####.##.#####.####.#",
"#o...........##...........o#",
"#............##............#",
"############################"
];

canvas.width = LEVEL[0].length * TILE;
canvas.height = LEVEL.length * TILE;

let walls = [];
let pellets = [];
let powerPellets = [];

let pacman;
let ghost;

let score = 0;
let lives = 3;

let gameRunning = true;
let gameWon = false;

let powerMode = false;
let powerTimer = 0;

let mouthOpen = true;
let mouthTimer = 0;


/* =========================
   INITIALIZE GAME
========================= */

function initGame() {

    walls = [];
    pellets = [];
    powerPellets = [];

    for (let row = 0; row < LEVEL.length; row++) {

        walls[row] = [];

        for (let col = 0; col < LEVEL[row].length; col++) {

            const tile = LEVEL[row][col];

            walls[row][col] = tile === "#";

            if (tile === ".") {

                pellets.push({
                    x: col * TILE + TILE / 2,
                    y: row * TILE + TILE / 2,
                    collected: false
                });

            }

            if (tile === "o") {

                powerPellets.push({
                    x: col * TILE + TILE / 2,
                    y: row * TILE + TILE / 2,
                    collected: false
                });
            }
        }
    }

    pacman = {
        x: 14 * TILE + TILE / 2,
        y: 18 * TILE + TILE / 2,

        dx: 0,
        dy: 0,

        nextDx: 0,
        nextDy: 0,

        speed: 3,

        direction: 0
    };


    /*
        ONLY ONE CHASER
    */

    ghost = {
        x: 14 * TILE + TILE / 2,
        y: 14 * TILE + TILE / 2,

        dx: 2,
        dy: 0,

        speed: 2.1,

        frightened: false
    };

    score = 0;
    lives = 3;

    gameRunning = true;
    gameWon = false;

    powerMode = false;
    powerTimer = 0;

    updateUI();
}


/* =========================
   WALL COLLISION
========================= */

function isWall(x, y) {

    const col = Math.floor(x / TILE);
    const row = Math.floor(y / TILE);

    if (
        row < 0 ||
        row >= LEVEL.length ||
        col < 0 ||
        col >= LEVEL[row].length
    ) {
        return true;
    }

    return walls[row][col];
}


function canMove(x, y, dx, dy) {

    const radius = 8;

    return (
        !isWall(x + dx - radius, y + dy - radius) &&
        !isWall(x + dx + radius, y + dy - radius) &&
        !isWall(x + dx - radius, y + dy + radius) &&
        !isWall(x + dx + radius, y + dy + radius)
    );
}


/* =========================
   PAC-MAN MOVEMENT
========================= */

function updatePacman() {

    /*
        Turn as soon as the requested
        direction is possible.
    */

    if (
        canMove(
            pacman.x,
            pacman.y,
            pacman.nextDx,
            pacman.nextDy
        )
    ) {

        pacman.dx = pacman.nextDx;
        pacman.dy = pacman.nextDy;

        if (pacman.dx > 0) pacman.direction = 0;
        if (pacman.dx < 0) pacman.direction = Math.PI;

        if (pacman.dy > 0) pacman.direction = Math.PI / 2;
        if (pacman.dy < 0) pacman.direction = -Math.PI / 2;
    }


    if (
        canMove(
            pacman.x,
            pacman.y,
            pacman.dx,
            pacman.dy
        )
    ) {

        pacman.x += pacman.dx;
        pacman.y += pacman.dy;
    }


    collectPellets();

    mouthTimer++;

    if (mouthTimer > 8) {

        mouthOpen = !mouthOpen;
        mouthTimer = 0;
    }
}


/* =========================
   PELLET COLLECTION
========================= */

function collectPellets() {

    for (const pellet of pellets) {

        if (pellet.collected) continue;

        const distance = Math.hypot(
            pacman.x - pellet.x,
            pacman.y - pellet.y
        );

        if (distance < 12) {

            pellet.collected = true;

            score += 10;

            updateUI();
        }
    }


    for (const pellet of powerPellets) {

        if (pellet.collected) continue;

        const distance = Math.hypot(
            pacman.x - pellet.x,
            pacman.y - pellet.y
        );

        if (distance < 14) {

            pellet.collected = true;

            score += 50;

            activatePowerMode();

            updateUI();
        }
    }


    const normalDone = pellets.every(p => p.collected);
    const powerDone = powerPellets.every(p => p.collected);

    if (normalDone && powerDone) {

        gameWon = true;
        gameRunning = false;

        messageElement.textContent = "🎉 YOU CLEARED THE MAZE!";
    }
}


/* =========================
   POWER MODE
========================= */

function activatePowerMode() {

    powerMode = true;

    powerTimer = 600;

    ghost.frightened = true;
}


function updatePowerMode() {

    if (!powerMode) return;

    powerTimer--;

    if (powerTimer <= 0) {

        powerMode = false;

        ghost.frightened = false;
    }
}


/* =========================
   ONE CHASER AI
========================= */

function updateGhost() {

    /*
        If ghost cannot continue,
        choose a new direction.
    */

    if (
        !canMove(
            ghost.x,
            ghost.y,
            ghost.dx,
            ghost.dy
        )
    ) {

        chooseGhostDirection();
    }


    /*
        Occasionally change direction
        to make the ghost feel less robotic.
    */

    if (Math.random() < 0.015) {

        chooseGhostDirection();
    }


    if (
        canMove(
            ghost.x,
            ghost.y,
            ghost.dx,
            ghost.dy
        )
    ) {

        ghost.x += ghost.dx;
        ghost.y += ghost.dy;
    }


    checkGhostCollision();
}


/* =========================
   GHOST CHASING
========================= */

function chooseGhostDirection() {

    const directions = [

        { dx: 2.1, dy: 0 },
        { dx: -2.1, dy: 0 },
        { dx: 0, dy: 2.1 },
        { dx: 0, dy: -2.1 }

    ];


    let possible = directions.filter(direction => {

        return canMove(
            ghost.x,
            ghost.y,
            direction.dx,
            direction.dy
        );

    });


    if (possible.length === 0) return;


    /*
        Do not immediately reverse
        unless necessary.
    */

    let filtered = possible.filter(direction => {

        return !(
            direction.dx === -ghost.dx &&
            direction.dy === -ghost.dy
        );

    });


    if (filtered.length > 0) {

        possible = filtered;
    }


    /*
        FRIGHTENED MODE:
        Ghost tries to move away from Pac-Man.
    */

    if (ghost.frightened) {

        possible.sort((a, b) => {

            const distanceA = Math.hypot(
                ghost.x + a.dx - pacman.x,
                ghost.y + a.dy - pacman.y
            );

            const distanceB = Math.hypot(
                ghost.x + b.dx - pacman.x,
                ghost.y + b.dy - pacman.y
            );

            return distanceB - distanceA;
        });

    }

    /*
        NORMAL MODE:
        Ghost chases Pac-Man.
    */

    else {

        possible.sort((a, b) => {

            const distanceA = Math.hypot(
                ghost.x + a.dx - pacman.x,
                ghost.y + a.dy - pacman.y
            );

            const distanceB = Math.hypot(
                ghost.x + b.dx - pacman.x,
                ghost.y + b.dy - pacman.y
            );

            return distanceA - distanceB;
        });
    }


    /*
        Usually take the best direction,
        sometimes choose randomly.
    */

    if (Math.random() < 0.8) {

        ghost.dx = possible[0].dx;
        ghost.dy = possible[0].dy;

    } else {

        const choice =
            possible[Math.floor(Math.random() * possible.length)];

        ghost.dx = choice.dx;
        ghost.dy = choice.dy;
    }
}


/* =========================
   GHOST COLLISION
========================= */

function checkGhostCollision() {

    const distance = Math.hypot(
        pacman.x - ghost.x,
        pacman.y - ghost.y
    );


    if (distance < 18) {

        if (powerMode) {

            /*
                Eat the ONE ghost.
            */

            score += 200;

            ghost.x = 14 * TILE + TILE / 2;
            ghost.y = 14 * TILE + TILE / 2;

            ghost.dx = 2.1;
            ghost.dy = 0;

            updateUI();

        } else {

            loseLife();
        }
    }
}


/* =========================
   LOSE LIFE
========================= */

function loseLife() {

    lives--;

    updateUI();


    if (lives <= 0) {

        gameRunning = false;

        messageElement.textContent = "💀 GAME OVER!";

        return;
    }


    /*
        Reset Pac-Man.
    */

    pacman.x = 14 * TILE + TILE / 2;
    pacman.y = 18 * TILE + TILE / 2;

    pacman.dx = 0;
    pacman.dy = 0;

    pacman.nextDx = 0;
    pacman.nextDy = 0;


    /*
        Reset ONE ghost.
    */

    ghost.x = 14 * TILE + TILE / 2;
    ghost.y = 14 * TILE + TILE / 2;

    ghost.dx = 2.1;
    ghost.dy = 0;


    messageElement.textContent =
        "⚠️ The chaser got you!";

    setTimeout(() => {

        if (gameRunning) {

            messageElement.textContent =
                "Use the arrow keys to move!";
        }

    }, 1500);
}


/* =========================
   DRAW MAZE
========================= */

function drawMaze() {

    for (let row = 0; row < LEVEL.length; row++) {

        for (let col = 0; col < LEVEL[row].length; col++) {

            if (LEVEL[row][col] === "#") {

                ctx.fillStyle = "#071eff";

                ctx.fillRect(
                    col * TILE,
                    row * TILE,
                    TILE,
                    TILE
                );


                ctx.strokeStyle = "#173dff";

                ctx.lineWidth = 1;

                ctx.strokeRect(
                    col * TILE + 2,
                    row * TILE + 2,
                    TILE - 4,
                    TILE - 4
                );
            }
        }
    }
}


/* =========================
   DRAW PELLETS
========================= */

function drawPellets() {

    ctx.fillStyle = "#fff";

    for (const pellet of pellets) {

        if (pellet.collected) continue;

        ctx.beginPath();

        ctx.arc(
            pellet.x,
            pellet.y,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /*
        Power pellets
    */

    for (const pellet of powerPellets) {

        if (pellet.collected) continue;

        ctx.fillStyle = "#fff";

        ctx.beginPath();

        ctx.arc(
            pellet.x,
            pellet.y,
            7,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================
   DRAW PAC-MAN
========================= */

function drawPacman() {

    ctx.save();

    ctx.translate(
        pacman.x,
        pacman.y
    );

    ctx.rotate(pacman.direction);

    ctx.fillStyle = "#ffd900";

    let mouth = mouthOpen ? 0.35 : 0.08;

    ctx.beginPath();

    ctx.moveTo(0, 0);

    ctx.arc(
        0,
        0,
        10,
        mouth,
        Math.PI * 2 - mouth
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}


/* =========================
   DRAW ONE GHOST
========================= */

function drawGhost() {

    let color =
        ghost.frightened
        ? "#1e65ff"
        : "#ff2222";


    /*
        Body
    */

    ctx.fillStyle = color;

    ctx.beginPath();

    ctx.arc(
        ghost.x,
        ghost.y - 2,
        10,
        Math.PI,
        0
    );

    ctx.lineTo(
        ghost.x + 10,
        ghost.y + 9
    );

    ctx.lineTo(
        ghost.x + 6,
        ghost.y + 6
    );

    ctx.lineTo(
        ghost.x + 2,
        ghost.y + 9
    );

    ctx.lineTo(
        ghost.x - 2,
        ghost.y + 6
    );

    ctx.lineTo(
        ghost.x - 6,
        ghost.y + 9
    );

    ctx.lineTo(
        ghost.x - 10,
        ghost.y + 9
    );

    ctx.closePath();

    ctx.fill();


    /*
        Eyes
    */

    if (!ghost.frightened) {

        ctx.fillStyle = "white";

        ctx.beginPath();

        ctx.arc(
            ghost.x - 4,
            ghost.y - 3,
            3,
            0,
            Math.PI * 2
        );

        ctx.arc(
            ghost.x + 4,
            ghost.y - 3,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle = "#111";

        ctx.beginPath();

        ctx.arc(
            ghost.x - 4,
            ghost.y - 3,
            1.5,
            0,
            Math.PI * 2
        );

        ctx.arc(
            ghost.x + 4,
            ghost.y - 3,
            1.5,
            0,
            Math.PI * 2
        );

        ctx.fill();

    } else {

        ctx.fillStyle = "white";

        ctx.font = "bold 13px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            "×",
            ghost.x,
            ghost.y + 4
        );
    }
}


/* =========================
   DRAW GAME
========================= */

function drawGame() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawMaze();
    drawPellets();
    drawPacman();
    drawGhost();


    /*
        Game-over overlay
    */

    if (!gameRunning) {

        ctx.fillStyle =
            "rgba(0,0,0,0.70)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.textAlign = "center";

        ctx.font =
            "bold 40px Arial";

        ctx.fillStyle =
            gameWon
            ? "#00ff88"
            : "#ff3333";


        ctx.fillText(
            gameWon
            ? "YOU WIN!"
            : "GAME OVER",
            canvas.width / 2,
            canvas.height / 2
        );


        ctx.font =
            "18px Arial";

        ctx.fillStyle = "white";

        ctx.fillText(
            "Press Restart to play again",
            canvas.width / 2,
            canvas.height / 2 + 40
        );
    }
}


/* =========================
   UI
========================= */

function updateUI() {

    scoreElement.textContent = score;
    livesElement.textContent = lives;
}


/* =========================
   KEYBOARD CONTROLS
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowUp") {

            pacman.nextDx = 0;
            pacman.nextDy = -pacman.speed;

            event.preventDefault();
        }


        if (event.key === "ArrowDown") {

            pacman.nextDx = 0;
            pacman.nextDy = pacman.speed;

            event.preventDefault();
        }


        if (event.key === "ArrowLeft") {

            pacman.nextDx = -pacman.speed;
            pacman.nextDy = 0;

            event.preventDefault();
        }


        if (event.key === "ArrowRight") {

            pacman.nextDx = pacman.speed;
            pacman.nextDy = 0;

            event.preventDefault();
        }
    }
);


/* =========================
   RESTART
========================= */

function restartGame() {

    initGame();

    messageElement.textContent =
        "Use the arrow keys to move!";
}


/* =========================
   MAIN GAME LOOP
========================= */

function gameLoop() {

    if (gameRunning) {

        updatePacman();

        updateGhost();

        updatePowerMode();
    }

    drawGame();

    requestAnimationFrame(gameLoop);
}


/* START */

initGame();

gameLoop();

</script>

</body>
</html>
